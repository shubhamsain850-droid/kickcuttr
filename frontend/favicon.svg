<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Rounded Base Background -->
  <rect width="64" height="64" rx="14" fill="#090c10"/>
  <rect x="1" y="1" width="62" height="62" rx="13" stroke="#53fc18" stroke-width="1.5" stroke-opacity="0.3"/>
  
  <!-- Left Filmstrip Spine (Vertical bar of 'K') -->
  <rect x="12" y="12" width="10" height="40" rx="3" fill="#53fc18"/>
  <rect x="14.5" y="16.5" width="5" height="4.5" rx="1.2" fill="#090c10"/>
  <rect x="14.5" y="25" width="5" height="4.5" rx="1.2" fill="#090c10"/>
  <rect x="14.5" y="34.5" width="5" height="4.5" rx="1.2" fill="#090c10"/>
  <rect x="14.5" y="43" width="5" height="4.5" rx="1.2" fill="#090c10"/>

  <!-- Scissor Blades forming K diagonals -->
  <!-- Top Blade -->
  <path d="M26 34L50 13C51.5 11.5 53 13 52 15L41 29L32 35Z" fill="#53fc18"/>
  <path d="M26 34L50 13" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Bottom Blade -->
  <path d="M26 30L50 51C51.5 52.5 53 51 52 49L41 35L32 29Z" fill="#53fc18"/>
  <path d="M26 30L50 51" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Pivot Screw / Rivet -->
  <circle cx="28" cy="32" r="4" fill="#090c10" stroke="#53fc18" stroke-width="2"/>
  <circle cx="28" cy="32" r="1.5" fill="#ffffff"/>
  
  <!-- Cut Spark / Blade Gleam -->
  <circle cx="51" cy="32" r="1.5" fill="#53fc18"/>
</svg>